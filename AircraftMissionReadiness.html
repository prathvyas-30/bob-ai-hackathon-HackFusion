// =========================================================
// SENSOR STANDARDS
// =========================================================
const SENSOR_STANDARDS = {
  engineTemp:   { key:'engineTemp',   label:'Engine Temperature',  unit:'°C',   min:1000, max:1390, criticalLow:900,   criticalHigh:1490, desc:'Standard: 1000–1390°C (±50°C tolerance)' },
  aircraftTemp: { key:'aircraftTemp', label:'Aircraft Temperature', unit:'°C',   min:50,   max:90,   criticalLow:30,    criticalHigh:110,  desc:'Standard: 70°C ±20°C (50–90°C normal range)' },
  vibration:    { key:'vibration',    label:'Vibration',           unit:'inch',  min:0.0,  max:0.2,  criticalLow:-0.05, criticalHigh:0.35, desc:'Standard: 0.0–0.2 inch' },
  pressure:     { key:'pressure',     label:'Pressure',            unit:'psi',   min:10.9, max:11.0, criticalLow:10.5,  criticalHigh:11.5, desc:'Standard: 10.9–11.0 psi' },
  oilPressure:  { key:'oilPressure',  label:'Oil Pressure',        unit:'psi',   min:30,   max:120,  criticalLow:15,    criticalHigh:140,  desc:'Standard: 30–120 psi' },
  voltage:      { key:'voltage',      label:'Voltage',             unit:'V',     min:115,  max:150,  criticalLow:100,   criticalHigh:165,  desc:'Standard: 115–150 V' },
  current:      { key:'current',      label:'Current',             unit:'A',     min:200,  max:400,  criticalLow:160,   criticalHigh:450,  desc:'Standard: 200–400 A' },
};
const SENSOR_KEYS = ['engineTemp','aircraftTemp','vibration','pressure','oilPressure','voltage','current'];
const SENSOR_WEIGHTS = { engineTemp:.22, vibration:.20, oilPressure:.18, pressure:.14, aircraftTemp:.12, voltage:.08, current:.06 };
const COMPONENT_MAP = {
  engineTemp:   { system:'Cooling System / Engine Thermal Management',         code:'cooling' },
  aircraftTemp: { system:'Airframe Thermal / Environmental Control System',    code:'ecs' },
  vibration:    { system:'Engine Bearing / Mechanical Drive System',           code:'bearing' },
  pressure:     { system:'Hydraulic / Pneumatic Pressure System',              code:'hydraulic' },
  oilPressure:  { system:'Engine Lubrication System',                          code:'lubrication' },
  voltage:      { system:'Electrical Power Generation System',                 code:'electrical' },
  current:      { system:'Electrical Load / Power Distribution System',        code:'power' },
};

// =========================================================
// DETERMINISTIC RISK ENGINE
// =========================================================
function sensorDeviation(value, std) {
  const { min, max, criticalLow, criticalHigh } = std;
  if (value >= min && value <= max) return { condition:'NORMAL', score:0 };
  if (value < min) {
    const below = min - value;
    const critRange = min - criticalLow;
    const ratio = Math.min(1, below / critRange);
    if (ratio >= 0.6) return { condition:'CRITICAL', score: 0.85 + ratio*0.15 };
    return { condition:'WARNING', score: 0.2 + ratio*0.65 };
  }
  const above = value - max;
  const critRange = criticalHigh - max;
  const ratio = Math.min(1, above / critRange);
  if (ratio >= 0.6) return { condition:'CRITICAL', score: 0.85 + ratio*0.15 };
  return { condition:'WARNING', score: 0.2 + ratio*0.65 };
}

function analyzeSensors(sensorValues) {
  const conditions = {}, contributions = {};
  let weightedScore = 0, hasCritical = false;
  for (const key of SENSOR_KEYS) {
    const val = parseFloat(sensorValues[key]);
    if (isNaN(val)) continue;
    const result = sensorDeviation(val, SENSOR_STANDARDS[key]);
    conditions[key] = result.condition;
    contributions[key] = { ...result, weight: SENSOR_WEIGHTS[key] };
    weightedScore += result.score * SENSOR_WEIGHTS[key];
    if (result.condition === 'CRITICAL') hasCritical = true;
  }
  const totalWeight = SENSOR_KEYS.reduce((s,k) => s + SENSOR_WEIGHTS[k], 0);
  const rawRisk = Math.min(100, Math.round((weightedScore / totalWeight) * 100));
  const riskScore = hasCritical ? Math.max(rawRisk, 81) : rawRisk;
  let riskLevel = riskScore<=30?'LOW':riskScore<=60?'MEDIUM':riskScore<=80?'HIGH':'CRITICAL';

  const issuesList = [];
  for (const key of SENSOR_KEYS) {
    const c = contributions[key];
    if (!c || c.score === 0) continue;
    issuesList.push({
      sensor: key, sensorLabel: SENSOR_STANDARDS[key].label,
      system: COMPONENT_MAP[key].system, code: COMPONENT_MAP[key].code,
      condition: c.condition, confidence: Math.round(Math.min(99, 50 + c.score*50)), score: c.score,
    });
  }
  issuesList.sort((a,b) => b.score - a.score);

  const abnormal = SENSOR_KEYS.filter(k => conditions[k] && conditions[k] !== 'NORMAL');
  let explanation = '';
  if (abnormal.length === 0) {
    explanation = 'All sensor readings are within normal operating ranges. Aircraft systems are performing nominally. No anomalies detected.';
  } else {
    const parts = abnormal.map(k => {
      const val = parseFloat(sensorValues[k]);
      const std = SENSOR_STANDARDS[k];
      const diff = val < std.min
        ? `${(std.min - val).toFixed(2)} ${std.unit} below minimum`
        : `${(val - std.max).toFixed(2)} ${std.unit} above maximum`;
      return `${std.label} is ${conditions[k]==='CRITICAL'?'critically':'slightly'} abnormal (${val}${std.unit}, ${diff})`;
    });
    explanation = parts.join('. ') + '. ';
    if (issuesList.length > 0) explanation += `Primary concern is the ${issuesList[0].system} requiring immediate inspection. `;
    if (hasCritical) explanation += 'Critical sensor condition detected — aircraft is NOT cleared for flight operations until inspection is complete.';
    else if (riskLevel==='HIGH') explanation += 'Elevated risk profile — maintenance inspection recommended before next flight.';
    else explanation += 'Monitoring and scheduled maintenance inspection recommended.';
  }

  let newStatus;
  if (hasCritical || riskLevel==='CRITICAL') newStatus = STATUS.NOT_READY;
  else if (riskLevel==='HIGH' || riskLevel==='MEDIUM') newStatus = STATUS.MAINTENANCE;
  else newStatus = STATUS.READY;

  const primaryFactor = issuesList.length > 0 ? `⚠️ ${issuesList[0].system}` : '✅ No abnormal contributing factors';
  return { conditions, contributions, riskScore, riskLevel, predictedIssues:issuesList,
           predictionConfidence: issuesList.length>0?issuesList[0].confidence:0,
           aiExplanation:explanation, primaryFactor, newStatus, hasCritical };
}

function validateSensorInputs(vals) {
  const errors = {};
  for (const key of SENSOR_KEYS) {
    const raw = vals[key];
    if (raw==='' || raw===null || raw===undefined) { errors[key]='Required — enter a numeric value'; continue; }
    if (isNaN(parseFloat(raw))) errors[key]='Invalid — must be numeric (e.g. 1050.5)';
  }
  return errors;
}

function computeStatusFromAc(ac) {
  const allDone = ac.requiredMaintenance.length===0 || ac.requiredMaintenance.every(m => ac.maintenanceCompletionState[m.id]);
  if (!allDone) return ac.components.some(c=>c.status==='FAIL') ? STATUS.NOT_READY : STATUS.MAINTENANCE;
  if (ac.sensorSubmitted && ac.riskScore !== null) {
    const hasCritSensor = Object.values(ac.sensorConditions||{}).some(c=>c==='CRITICAL');
    if (hasCritSensor || ac.riskLevel==='CRITICAL') return STATUS.NOT_READY;
    if (ac.riskLevel==='HIGH' || ac.riskLevel==='MEDIUM') return STATUS.MAINTENANCE;
    return STATUS.READY;
  }
  return STATUS.READY;
}

function maintenanceLabel(ac, st) {
  if (st===STATUS.READY) return 'Complete';
  if (st===STATUS.NOT_READY) return 'Critical Repair Required';
  if (st===STATUS.MAINTENANCE) return 'Maintenance Required';
  return ac.maintenanceStatus;
}

function condIcon(c){ return c==='CRITICAL'?'🔴':c==='WARNING'?'⚠️':'🟢'; }
function condLabel(c){ return c==='CRITICAL'?'CRITICAL':c==='WARNING'?'WARNING':'NORMAL'; }

function riskIcon(r){ return r==='CRITICAL'?'🔴':r==='HIGH'?'🟠':r==='MEDIUM'?'🟡':'🟢'; }

// =========================================================
// HELPER COMPONENTS
// =========================================================
function StatusBadge({ status, large }) {
  return (
    <span style={{
      display:'inline-block', padding: large?'6px 16px':'3px 10px',
      borderRadius:20, fontSize:large?14:11, fontWeight:800, letterSpacing:'.04em',
      background:STATUS_BG[status], color:STATUS_COLORS[status],
      border:`2px solid ${STATUS_BORDER[status]}`,
    }}>{STATUS_LABELS[status]}</span>
  );
}

function SectionHdr({ children }) {
  return <div className="section-hdr">{children}</div>;
}

function InfoRow({ label, value }) {
  return (
    <div className="info-row">
      <span style={{fontSize:12,color:'#57606a',fontWeight:600}}>{label}</span>
      <span style={{fontSize:13,color:'#1f2328',fontWeight:500,textAlign:'right',maxWidth:'60%'}}>{value}</span>
    </div>
  );
}

function RiskBar({ score }) {
  let color = '#16a34a';
  if (score>80) color='#dc2626'; else if(score>60) color='#ea580c'; else if(score>30) color='#ca8a04';
  return (
    <div style={{height:10,background:'#e5e7eb',borderRadius:6,overflow:'hidden',marginTop:6}}>
      <div style={{width:`${score}%`,height:'100%',background:color,borderRadius:6,transition:'width .4s'}}/>
    </div>
  );
}

// =========================================================
// DASHBOARD
// =========================================================
function CounterCard({ emoji, label, count, color, bg, border }) {
  return (
    <div style={{background:bg,border:`2px solid ${border}`,borderRadius:12,padding:'16px 20px',
      minWidth:120,flex:1,textAlign:'center'}}>
      <div style={{fontSize:30,fontWeight:900,color,lineHeight:1}}>{count}</div>
      <div style={{fontSize:11,color:'#57606a',marginTop:4,fontWeight:600,letterSpacing:'.03em'}}>{emoji} {label}</div>
    </div>
  );
}

function AircraftCard({ ac, onSelect }) {
  return (
    <div className="ac-card" onClick={() => onSelect(ac.id)}
      style={{borderLeft:`5px solid ${STATUS_COLORS[ac.status]}`,border:`1.5px solid ${STATUS_BORDER[ac.status]}`,borderLeft:`5px solid ${STATUS_COLORS[ac.status]}`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontWeight:800,fontSize:16}}>{ac.id}</span>
            {ac.goingToFly && <span style={{fontSize:10,background:'#eff6ff',color:'#2563eb',border:'1px solid #bfdbfe',borderRadius:10,padding:'2px 8px',fontWeight:700}}>✈ GOING TO FLY</span>}
          </div>
          <div style={{fontSize:13,color:'#57606a',marginTop:2}}>{ac.name}</div>
          <div style={{fontSize:12,color:'#8b949e',marginTop:1}}>Model: {ac.model} · Reg: {ac.registration}</div>
          {ac.status===STATUS.LANDED && (
            <div style={{fontSize:11,color:'#ea580c',marginTop:3}}>
              {ac.arrivalTime && `Arrived: ${ac.arrivalTime}`}{ac.flightDuration && ` · Flight: ${ac.flightDuration}`}
            </div>
          )}
        </div>
        <div style={{textAlign:'right'}}>
          <StatusBadge status={ac.status}/>
          <div style={{fontSize:11,color:'#57606a',marginTop:5}}>Maint: {ac.maintenanceStatus}</div>
          {ac.riskScore!==null && <div style={{fontSize:11,color:STATUS_COLORS[ac.status],marginTop:2}}>Risk: {ac.riskScore}%</div>}
        </div>
      </div>
    </div>
  );
}

function DivisionPanel({ title, emoji, status, items, onSelect }) {
  return (
    <div style={{background:STATUS_BG[status],border:`2px solid ${STATUS_BORDER[status]}`,borderRadius:14,padding:'18px 20px',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:14,color:STATUS_COLORS[status],letterSpacing:'.04em'}}>{emoji} {title}</div>
        <span style={{background:STATUS_COLORS[status],color:'#fff',borderRadius:20,padding:'2px 12px',fontSize:13,fontWeight:700}}>{items.length}</span>
      </div>
      {items.length===0
        ? <div style={{color:'#8b949e',fontSize:13,padding:'12px 0',textAlign:'center'}}>No aircraft in this category</div>
        : items.map(ac => <AircraftCard key={ac.id} ac={ac} onSelect={onSelect}/>)
      }
    </div>
  );
}

function Dashboard({ aircraft, onSelect }) {
  const ready = aircraft.filter(a=>a.status===STATUS.READY);
  const maint = aircraft.filter(a=>a.status===STATUS.MAINTENANCE);
  const notReady = aircraft.filter(a=>a.status===STATUS.NOT_READY);
  const landed = aircraft.filter(a=>a.status===STATUS.LANDED);
  return (
    <div style={{minHeight:'100vh',background:'#f0f2f5'}}>
      <div style={{background:'#0d1117',color:'#fff'}}>
        <div style={{maxWidth:1400,margin:'0 auto',padding:'18px 24px',display:'flex',alignItems:'center',gap:16}}>
          <div style={{fontSize:28}}>✈</div>
          <div>
            <div style={{fontWeight:800,fontSize:18,letterSpacing:'.05em',color:'#f0f6ff'}}>AIRCRAFT MISSION READINESS</div>
            <div style={{fontSize:11,color:'#8b949e',letterSpacing:'.08em',marginTop:1}}>PREDICTIVE MAINTENANCE DASHBOARD — COMMAND CENTER</div>
          </div>
          <div style={{marginLeft:'auto',textAlign:'right'}}>
            <div style={{fontSize:11,fontWeight:600,color:'#c9d1d9',letterSpacing:'.05em'}}>TOTAL AIRCRAFT</div>
            <div style={{fontSize:28,fontWeight:900,color:'#58a6ff',lineHeight:1.1}}>{aircraft.length}</div>
          </div>
        </div>
        <div style={{background:'#161b22',borderTop:'1px solid #21262d',padding:'6px 24px'}}>
          <div style={{maxWidth:1400,margin:'0 auto',fontSize:10.5,color:'#6e7681'}}>
            ⚠️ PROTOTYPE — AI predictive maintenance is a decision-support system. Predictions are estimates only and require certified maintenance personnel verification. Not for operational use.
          </div>
        </div>
      </div>
      <div style={{maxWidth:1400,margin:'0 auto',padding:'24px'}}>
        <div style={{display:'flex',gap:12,marginBottom:24,flexWrap:'wrap'}}>
          <CounterCard emoji="✈" label="TOTAL" count={aircraft.length} color="#3b82d4" bg="#eff6ff" border="#bfdbfe"/>
          <CounterCard emoji="🟢" label="READY TO FLY" count={ready.length} color="#16a34a" bg="#f0fdf4" border="#86efac"/>
          <CounterCard emoji="🟡" label="MAINTENANCE REQ." count={maint.length} color="#ca8a04" bg="#fefce8" border="#fde047"/>
          <CounterCard emoji="🔴" label="NOT READY" count={notReady.length} color="#dc2626" bg="#fef2f2" border="#fca5a5"/>
          <CounterCard emoji="🟠" label="RECENTLY LANDED" count={landed.length} color="#ea580c" bg="#fff7ed" border="#fdba74"/>
        </div>
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:10,padding:'12px 18px',marginBottom:20,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:16}}>ℹ️</span>
          <span style={{fontSize:13,color:'#57606a'}}>Click any aircraft card to view details, sensor data, maintenance workflow, and AI risk assessment. Recently landed aircraft require sensor submission to determine mission readiness.</span>
        </div>
        <div className="grid-dash" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:20}}>
          <DivisionPanel title="READY TO FLY" emoji="🟢" status={STATUS.READY} items={ready} onSelect={onSelect}/>
          <DivisionPanel title="MAINTENANCE REQUIRED" emoji="🟡" status={STATUS.MAINTENANCE} items={maint} onSelect={onSelect}/>
          <DivisionPanel title="NOT READY TO FLY" emoji="🔴" status={STATUS.NOT_READY} items={notReady} onSelect={onSelect}/>
          <DivisionPanel title="RECENTLY LANDED" emoji="🟠" status={STATUS.LANDED} items={landed} onSelect={onSelect}/>
        </div>
      </div>
    </div>
  );
}

const TABS = ['📋 Overview','📅 History','🔧 Components & Maintenance','📡 Sensor Analysis'];

function OverviewTab({ ac }) {
  return (
    <div className="card">
      <SectionHdr>Aircraft Information</SectionHdr>
      <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 24px'}}>
        <div>
          <InfoRow label="Aircraft ID" value={ac.id}/>
          <InfoRow label="Type / Name" value={ac.name}/>
          <InfoRow label="Model" value={ac.model}/>
          <InfoRow label="Registration" value={ac.registration}/>
          <InfoRow label="General Condition" value={ac.generalCondition}/>
        </div>
        <div>
          <InfoRow label="Last Maintenance" value={ac.lastMaintenanceDate}/>
          <InfoRow label="Total Operating Hours" value={`${ac.totalOperatingHours.toLocaleString()} hrs`}/>
          <InfoRow label="Maintenance Status" value={ac.maintenanceStatus}/>
          {ac.status===STATUS.LANDED && ac.flightDuration && <InfoRow label="Last Flight Duration" value={ac.flightDuration}/>}
          {ac.status===STATUS.LANDED && ac.arrivalTime && <InfoRow label="Arrival Time" value={ac.arrivalTime}/>}
        </div>
      </div>
      <div style={{marginTop:16,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <StatusBadge status={ac.status} large/>
        {ac.goingToFly && (
          <span style={{fontSize:12,background:'#eff6ff',color:'#2563eb',border:'1px solid #bfdbfe',borderRadius:10,padding:'4px 12px',fontWeight:700}}>✈ GOING TO FLY — Scheduled</span>
        )}
        {ac.goingToFly && (ac.status===STATUS.NOT_READY||ac.status===STATUS.MAINTENANCE) && (
          <span style={{fontSize:11,color:'#dc2626',fontWeight:700}}>⚠️ Safety override in effect — Current status remains {STATUS_LABELS[ac.status]}</span>
        )}
      </div>
      {ac.riskScore!==null && (
        <div style={{marginTop:16,padding:'12px 16px',background:'#f8fafc',border:'1px solid #e5e7eb',borderRadius:10}}>
          <div style={{fontSize:11,fontWeight:700,color:'#57606a',letterSpacing:'.08em',marginBottom:6}}>LATEST AI RISK ASSESSMENT</div>
          <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <div>
              <span style={{fontSize:28,fontWeight:900,color:riskColor(ac.riskLevel)}}>{riskIcon(ac.riskLevel)} {ac.riskScore}%</span>

        </div>
      )}
    </div>
  );
}

                <StatusBadge status={h.status}/>

function ComponentsTab({ ac, updateAircraft }) {
  const [undoStack, setUndoStack] = useState([]);
  const healthy = ac.components.filter(c=>c.status==='OK');
  const faulty = ac.components.filter(c=>c.status!=='OK');

  const toggle = (mId) => {
    const prevState = { completionState:{...ac.maintenanceCompletionState}, status:ac.status, maintenanceStatus:ac.maintenanceStatus };
    setUndoStack(s=>[...s,prevState]);
    const next = {...ac.maintenanceCompletionState, [mId]:!ac.maintenanceCompletionState[mId]};
    const updatedAc = {...ac, maintenanceCompletionState:next};
    const newStatus = computeStatusFromAc(updatedAc);
    updateAircraft(ac.id, prev => ({...prev, maintenanceCompletionState:next, status:newStatus, maintenanceStatus:maintenanceLabel(prev,newStatus)}));
  };

  const markAll = () => {
    const prevState = { completionState:{...ac.maintenanceCompletionState}, status:ac.status, maintenanceStatus:ac.maintenanceStatus };
    setUndoStack(s=>[...s,prevState]);
    const next = {};
    ac.requiredMaintenance.forEach(m => { next[m.id]=true; });
    const updatedAc = {...ac, maintenanceCompletionState:next};
    const newStatus = computeStatusFromAc(updatedAc);
    updateAircraft(ac.id, prev => ({...prev, maintenanceCompletionState:next, status:newStatus, maintenanceStatus:maintenanceLabel(prev,newStatus)}));
  };

  const undo = () => {
    if (!undoStack.length) return;
    const last = undoStack[undoStack.length-1];
    setUndoStack(s=>s.slice(0,-1));
    const updatedAc = {...ac, maintenanceCompletionState:last.completionState};
    const newStatus = computeStatusFromAc(updatedAc);
    updateAircraft(ac.id, prev => ({...prev, maintenanceCompletionState:last.completionState, status:newStatus, maintenanceStatus:maintenanceLabel(prev,newStatus)}));
  };

  const allDone = ac.requiredMaintenance.length>0 && ac.requiredMaintenance.every(m=>ac.maintenanceCompletionState[m.id]);

  return (
    <div className="card">
      {faulty.length>0 && (
        <>
          <SectionHdr>Damaged / Faulty Components</SectionHdr>
          {faulty.map(c=>(
            <div key={c.id} style={{background:c.status==='FAIL'?'#fef2f2':'#fefce8',border:`1.5px solid ${c.status==='FAIL'?'#fca5a5':'#fde047'}`,borderRadius:10,padding:'12px 16px',marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:13,color:c.status==='FAIL'?'#dc2626':'#92400e'}}>
                {c.status==='FAIL'?'❌':'⚠️'} {c.name} — {c.status==='FAIL'?'Damaged':'Degraded'}
              </div>
              {c.faultDesc && <div style={{fontSize:12,color:'#57606a',marginTop:4}}>{c.faultDesc}</div>}
              <div style={{display:'flex',gap:16,marginTop:6,flexWrap:'wrap'}}>
                {c.severity && <span style={{fontSize:11,color:c.severity==='Critical'?'#dc2626':'#ca8a04',fontWeight:700}}>Severity: {c.severity}</span>}
                {c.dateDetected && <span style={{fontSize:11,color:'#57606a'}}>Detected: {c.dateDetected}</span>}
                {c.replacementRequired && <span style={{fontSize:11,color:'#dc2626',fontWeight:700}}>🔧 Replacement Required</span>}
              </div>
              {c.action && <div style={{fontSize:12,color:'#7c5cd8',marginTop:4,fontWeight:600}}>→ Recommended: {c.action}</div>}
            </div>
          ))}
        </>
      )}

      <SectionHdr>Healthy Components</SectionHdr>
      {healthy.length===0
        ? <p style={{fontSize:13,color:'#8b949e'}}>No fully healthy components.</p>
        : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8,marginBottom:16}}>
            {healthy.map(c=>(
              <div key={c.id} style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:8,padding:'8px 12px',fontSize:13,color:'#166534',fontWeight:600}}>✅ {c.name}</div>
            ))}
          </div>
      }

      {ac.requiredMaintenance.length>0 && (
        <>
          <SectionHdr>Required Maintenance Tasks</SectionHdr>
          <div style={{marginBottom:16}}>
            {ac.requiredMaintenance.map(m=>{
              const done = ac.maintenanceCompletionState[m.id];
              return (
                <div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',borderRadius:8,marginBottom:8,
                  background:done?'#f0fdf4':'#fef2f2',border:`1.5px solid ${done?'#86efac':'#fca5a5'}`}}>
                  <input type="checkbox" checked={!!done} onChange={()=>toggle(m.id)}
                    style={{width:18,height:18,cursor:'pointer',accentColor:'#16a34a'}}/>
                  <span style={{fontSize:13,fontWeight:600,color:done?'#166534':'#7f1d1d',textDecoration:done?'line-through':'none',flex:1}}>
                    {done?'✅':'❌'} {m.task}
                  </span>
                  <span style={{fontSize:11,color:'#57606a',fontWeight:600,textTransform:'uppercase'}}>{m.type}</span>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
            {!allDone
              ? <button className="btn-success" onClick={markAll}>✓ Mark All Complete</button>
              : <button className="btn-done" disabled>✅ All Completed ✓</button>
            }
            {undoStack.length>0 && <button className="btn-undo" onClick={undo}>↩ Undo</button>}
          </div>
          {allDone && (
            <div style={{marginTop:16,background:'#f0fdf4',border:'2px solid #86efac',borderRadius:10,padding:'14px 18px'}}>
              <div style={{fontWeight:800,color:'#166534',fontSize:14,marginBottom:8}}>✅ All maintenance tasks completed</div>
              <StatusBadge status={ac.status} large/>
            </div>
          )}
        </>
      )}
      {ac.requiredMaintenance.length===0 && (
        <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:8,padding:'10px 14px',marginTop:12,fontSize:13,color:'#166534',fontWeight:600}}>
          ✅ No outstanding maintenance requirements
        </div>
      )}
    </div>
  );
}

function SensorAnalysisTab({ ac, updateAircraft }) {
  const [inputs, setInputs] = useState(() => ({...ac.sensorData}));
  const [errors, setErrors] = useState({});
  const [flightDuration, setFlightDuration] = useState(ac.flightDuration||'');
  const [arrivalTime, setArrivalTime] = useState(ac.arrivalTime||'');
  const [goingToFly, setGoingToFly] = useState(ac.goingToFly||false);
  const [flightErrors, setFlightErrors] = useState({});
  const [submitted, setSubmitted] = useState(ac.sensorSubmitted||false);
  const [result, setResult] = useState(ac.sensorSubmitted ? {
    conditions:ac.sensorConditions, riskScore:ac.riskScore, riskLevel:ac.riskLevel,
    predictedIssues:ac.predictedIssues, predictionConfidence:ac.predictionConfidence,
    aiExplanation:ac.aiExplanation, primaryFactor:ac.primaryFactor,
  } : null);

  const validateFlight = () => {
    const fe = {};
    if (flightDuration && !/^\d{1,2}:\d{2}(:\d{2})?$/.test(flightDuration))
      fe.flightDuration = 'Invalid format — use HH:MM or HH:MM:SS';
    if (arrivalTime && !/^\d{1,2}:\d{2}$/.test(arrivalTime))
      fe.arrivalTime = 'Invalid format — use HH:MM (e.g. 18:42)';
    return fe;
  };

  const handleSubmit = () => {
    const fe = validateFlight();
    setFlightErrors(fe);
    if (Object.keys(fe).length) return;
    const se = validateSensorInputs(inputs);
    setErrors(se);
    if (Object.keys(se).length) return;

    const res = analyzeSensors(inputs);
    setResult(res);
    setSubmitted(true);

    const newHistoryEntry = {
      date: new Date().toISOString().split('T')[0],
      riskScore:res.riskScore, riskLevel:res.riskLevel,
      issue: res.predictedIssues.length>0 ? res.predictedIssues[0].system : 'No issues detected',
      status: res.newStatus,
    };

    updateAircraft(ac.id, prev => ({
      ...prev,
      sensorData:{...inputs},
      sensorConditions:res.conditions,
      sensorSubmitted:true,
      riskScore:res.riskScore, riskLevel:res.riskLevel,
      predictedIssues:res.predictedIssues,
      predictionConfidence:res.predictionConfidence,
      aiExplanation:res.aiExplanation,
      primaryFactor:res.primaryFactor,
      status:res.newStatus,
      flightDuration, arrivalTime, goingToFly,
      maintenanceStatus:maintenanceLabel(prev, res.newStatus),
      aiAnalysisHistory:[newHistoryEntry,...(prev.aiAnalysisHistory||[])],
    }));
  };

  const handleReset = () => {
    setSubmitted(false);
    setResult(null);
    setErrors({});
    setFlightErrors({});
  };

  const handleGoingToFly = (val) => {
    setGoingToFly(val);
    updateAircraft(ac.id, prev => ({...prev, goingToFly:val}));
  };

  return (
    <div className="card">
      {/* Flight info for landed aircraft */}
      {(ac.status===STATUS.LANDED||flightDuration||arrivalTime) && (
        <>
          <SectionHdr>Recently Landed — Flight Information</SectionHdr>
          <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:20}}>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:'#57606a',display:'block',marginBottom:4}}>Flight Time Taken</label>
              <input value={flightDuration} onChange={e=>setFlightDuration(e.target.value)}
                placeholder="e.g. 02:35:20 or 01:30"
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:`1.5px solid ${flightErrors.flightDuration?'#dc2626':'#e5e7eb'}`,fontSize:13}}/>
              {flightErrors.flightDuration && <div style={{color:'#dc2626',fontSize:11,marginTop:3}}>⚠ {flightErrors.flightDuration}</div>}
            </div>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:'#57606a',display:'block',marginBottom:4}}>Arrival Time at Port</label>
              <input value={arrivalTime} onChange={e=>setArrivalTime(e.target.value)}
                placeholder="e.g. 18:42"
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:`1.5px solid ${flightErrors.arrivalTime?'#dc2626':'#e5e7eb'}`,fontSize:13}}/>
              {flightErrors.arrivalTime && <div style={{color:'#dc2626',fontSize:11,marginTop:3}}>⚠ {flightErrors.arrivalTime}</div>}
            </div>
          </div>
        </>
      )}

      {/* Going to Fly checkbox */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20,padding:'10px 14px',background:'#eff6ff',borderRadius:8,border:'1.5px solid #bfdbfe',flexWrap:'wrap'}}>
        <input type="checkbox" id="gtf" checked={goingToFly} onChange={e=>handleGoingToFly(e.target.checked)}
          style={{width:18,height:18,cursor:'pointer',accentColor:'#2563eb'}}/>
        <label htmlFor="gtf" style={{fontWeight:700,fontSize:13,color:'#1d4ed8',cursor:'pointer'}}>
          {goingToFly?'☑':'☐'} GOING TO FLY — Flight Intent Scheduled
        </label>
        {goingToFly&&(ac.status===STATUS.NOT_READY||ac.status===STATUS.MAINTENANCE) && (
          <span style={{fontSize:11,color:'#dc2626',fontWeight:700}}>
            ⚠️ Safety override: {STATUS_LABELS[ac.status]} status remains in effect
          </span>
        )}
      </div>

      {/* Sensor Inputs */}
      <SectionHdr>Post-Flight Sensor Data</SectionHdr>
      <div style={{fontSize:12,color:'#57606a',marginBottom:14}}>Enter all measured values. All 7 fields required. Accepts decimal numbers (e.g. 1050.5).</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:14,marginBottom:22}}>
        {SENSOR_KEYS.map(key => {
          const std = SENSOR_STANDARDS[key];
          const cond = result?.conditions?.[key];
          return (
            <div key={key} style={{
              background:cond==='CRITICAL'?'#fef2f2':cond==='WARNING'?'#fefce8':cond==='NORMAL'?'#f0fdf4':'#f8fafc',
              border:`1.5px solid ${cond==='CRITICAL'?'#fca5a5':cond==='WARNING'?'#fde047':cond==='NORMAL'?'#86efac':'#e5e7eb'}`,
              borderRadius:10, padding:'12px 14px',
            }}>
              <div style={{fontWeight:700,fontSize:13,color:'#1f2328',marginBottom:2}}>{std.label}</div>
              <div style={{fontSize:11,color:'#57606a',marginBottom:7}}>{std.desc}</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="number" step="any" value={inputs[key]??''}
                  onChange={e=>{setInputs(p=>({...p,[key]:e.target.value}));if(errors[key])setErrors(p=>({...p,[key]:undefined}));}}
                  placeholder={`e.g. ${((std.min+std.max)/2).toFixed(1)}`}
                  style={{flex:1,padding:'7px 10px',borderRadius:7,border:`1.5px solid ${errors[key]?'#dc2626':'#d1d5db'}`,fontSize:13}}/>
                <span style={{fontSize:12,color:'#57606a',fontWeight:600,minWidth:32}}>{std.unit}</span>
              </div>
              {errors[key] && <div style={{color:'#dc2626',fontSize:11,marginTop:3}}>⚠ {errors[key]}</div>}
              {cond && (
                <div style={{marginTop:7,fontSize:12,fontWeight:700,color:condColor(cond)}}>
                  {condIcon(cond)} {condLabel(cond)}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Submit controls */}
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        {!submitted
          ? <button className="btn-primary" onClick={handleSubmit}>☐ SUBMIT SENSOR DATA</button>
          : <>
              <button className="btn-done" disabled>☑ SUBMITTED ✓</button>
              <button className="btn-resubmit" onClick={handleReset}>↻ New Submission (Resubmit)</button>
            </>
        }
      </div>

      {/* Analysis Result */}
      {result && submitted && <AnalysisResultPanel result={result} aircraftId={ac.id} sensorInputs={inputs} currentStatus={ac.status}/>}
    </div>
  );
}

  const rc = riskColor(riskLevel);
  const ri = riskIcon(riskLevel);
  return (
    <div style={{marginTop:24,background:'#f8fafc',border:'2px solid #e5e7eb',borderRadius:14,padding:'20px'}}>
      <div style={{fontWeight:800,fontSize:16,color:'#1f2328',marginBottom:18,letterSpacing:'.04em',borderBottom:'2px solid #e5e7eb',paddingBottom:10}}>
        📊 SENSOR ANALYSIS COMPLETE — {aircraftId}

      {/* Sensor Conditions */}
      <div style={{fontWeight:700,fontSize:12,color:'#57606a',letterSpacing:'.08em',marginBottom:10}}>SENSOR CONDITIONS</div>

        {SENSOR_KEYS.map(key=>{
          const cond = conditions[key]||'NORMAL';
          const std = SENSOR_STANDARDS[key];

          return (
            <div key={key} style={{background:cond==='CRITICAL'?'#fef2f2':cond==='WARNING'?'#fefce8':'#f0fdf4',

              <div style={{fontSize:12,color:'#57606a',marginTop:1}}>{isNaN(val)?'—':`${val} ${std.unit}`}</div>
              <div style={{fontSize:12,fontWeight:700,color:condColor(cond),marginTop:4}}>{condIcon(cond)} {condLabel(cond)}</div>
            </div>
          );
        })}
      </div>

      {/* Risk + Status */}
      <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:22}}>
        <div style={{background:'#fff',border:`2px solid ${rc}`,borderRadius:12,padding:16}}>
          <div style={{fontSize:11,fontWeight:700,color:'#57606a',letterSpacing:'.08em',marginBottom:6}}>AI RISK ASSESSMENT</div>

          <RiskBar score={riskScore}/>
        </div>
        <div style={{background:'#fff',border:'1.5px solid #e5e7eb',borderRadius:12,padding:16}}>
          <div style={{fontSize:11,fontWeight:700,color:'#57606a',letterSpacing:'.08em',marginBottom:8}}>FINAL AIRCRAFT STATUS</div>
          <StatusBadge status={currentStatus} large/>
          <div style={{fontSize:12,fontWeight:700,color:'#57606a',marginTop:12}}>PRIMARY RISK FACTOR</div>
          <div style={{fontSize:13,color:'#1f2328',marginTop:4}}>{primaryFactor}</div>
        </div>
      </div>

      {/* Risk bar per sensor */}
      <div style={{fontWeight:700,fontSize:12,color:'#57606a',letterSpacing:'.08em',marginBottom:10}}>RISK CONTRIBUTION BY SENSOR</div>
      <div style={{marginBottom:22}}>
        {SENSOR_KEYS.map(key=>{
          const cond = conditions[key]||'NORMAL';
          return (
            <div key={key} style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
              <span style={{fontSize:12,width:200,color:'#1f2328',fontWeight:600}}>{SENSOR_STANDARDS[key].label}</span>

              <div style={{flex:1,height:8,background:'#e5e7eb',borderRadius:4}}>

          );

      {/* Predicted Issues */}

        <>
          <div style={{fontWeight:700,fontSize:12,color:'#57606a',letterSpacing:'.08em',marginBottom:10}}>PREDICTED POTENTIAL ISSUES</div>
          <div style={{marginBottom:22}}>
            {predictedIssues.map((issue,i)=>(
              <div key={i} style={{background:issue.condition==='CRITICAL'?'#fef2f2':'#fefce8',

                  </div>
                  <span style={{fontSize:12,fontWeight:700,color:condColor(issue.condition),
                    background:'#fff',border:`1px solid ${condColor(issue.condition)}`,borderRadius:12,padding:'2px 10px'}}>
                    Confidence: {issue.confidence}%
                  </span>
                </div>
                <div style={{fontSize:12,color:'#57606a',marginTop:4}}>
                  ⚠️ Requires Inspection — Predicted from abnormal {issue.sensorLabel} readings
                </div>
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:'#57606a',marginBottom:18,fontStyle:'italic'}}>
            Prediction Confidence: <strong>{predictionConfidence}%</strong> — Estimated predictions for inspection purposes only. Not guaranteed failures. Requires certified maintenance personnel verification.
          </div>
        </>
      )}

      {/* AI Explanation */}
      <div style={{background:'#f0f8ff',border:'1.5px solid #bfdbfe',borderRadius:12,padding:16}}>
        <div style={{fontWeight:800,fontSize:13,color:'#1d4ed8',marginBottom:8,letterSpacing:'.04em'}}>🤖 AI ANALYSIS EXPLANATION</div>
        <div style={{fontSize:13,color:'#1f2328',lineHeight:1.75}}>{aiExplanation}</div>
        <div style={{marginTop:10,fontSize:11,color:'#6e7681',borderTop:'1px solid #dbeafe',paddingTop:8}}>
          PROTOTYPE DISCLAIMER — This is a deterministic decision-support estimate. Results require verification by certified maintenance and flight operations personnel before any operational decision.
        </div>
      </div>
    </div>
  );
}

            <span style={{fontSize:18}}>🟠</span>
            <div>
              <div style={{fontWeight:800,fontSize:14,color:'#ea580c'}}>RECENTLY LANDED — SENSOR SUBMISSION REQUIRED</div>
              <div style={{fontSize:12,color:'#57606a',marginTop:2}}>
                Aircraft has recently landed. Enter post-flight sensor readings in the Sensor Analysis tab to determine mission readiness status.
                {ac.flightDuration&&` Flight time: ${ac.flightDuration}.`}{ac.arrivalTime&&` Arrived: ${ac.arrivalTime}.`}
              </div>
            </div>
          </div>
        )}

        {/* Tab content */}
        {tab===TABS[0] && <OverviewTab ac={ac}/>}
        {tab===TABS[1] && <HistoryTab ac={ac}/>}
        {tab===TABS[2] && <ComponentsTab ac={ac} updateAircraft={updateAircraft}/>}
        {tab===TABS[3] && <SensorAnalysisTab ac={ac} updateAircraft={updateAircraft}/>}
      </div>
    </div>
  );
}

// =========================================================
// APP ROOT
// =========================================================
function App() {
  const [aircraft, setAircraft] = useState(() => INITIAL_AIRCRAFT.map(a=>({...a})));
  const [selectedId, setSelectedId] = useState(null);

  const updateAircraft = useCallback((id, updater) => {
    setAircraft(prev => prev.map(a => a.id===id ? (typeof updater==='function' ? updater(a) : {...a,...updater}) : a));
  }, []);

  const selected = aircraft.find(a=>a.id===selectedId)||null;

  if (selected) {
    return <AircraftDetail aircraft={selected} allAircraft={aircraft} updateAircraft={updateAircraft} onBack={()=>setSelectedId(null)}/>;
  }
  return <Dashboard aircraft={aircraft} onSelect={setSelectedId}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
